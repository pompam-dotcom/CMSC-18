<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Selectors Lab</title>
    <style>
p { font-size: 20px; }

.item { background-color: lightyellow; }
.special { font-weight: bold; }

#title { text-align: center; }
#menu { border: 2px solid black; }

h1, h2 { color: navy; }

#about p { background-color: lavender; }

p.special { text-decoration: underline; }

a:hover { color: red; }
.item:hover { background-color: orange; }


    </style>
</head>
<body>
    <h1 id="title">Corner Bakery</h1>
    <p class="tagline">Fresh bread and pastries every day.</p>
    <div id="menu">
        <h2>Menu</h2>
        <ul>
            <li class="item">Pandesal</li>
            <li class="item special">Ube Cheese Roll</li>
            <li class="item">Banana Bread</li>
        </ul>
    </div>
    <div id="about">
        <h2>About</h2>
        <p>We bake in small batches.</p>
        <p id="note" class="special">Our ube rolls are made from scratch.</p>
        <a href="https://example.com">Visit our page</a>
    </div>
</body>
</html>
